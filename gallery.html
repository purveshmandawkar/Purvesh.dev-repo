<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Purvesh Mandawkar</title>
  <meta name="description" content="Project photos, experiments, prototypes, and circuit designs by Purvesh Mandawkar." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #ffffff;
      --bg2: #f8fafc;
      --border: #e2e8f0;
      --border2: #cbd5e1;
      --accent: #2563eb;
      --accent2: #1d4ed8;
      --text: #0f172a;
      --muted: #64748b;
      --muted2: #475569;
    }

    body {
      font-family: Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      z-index: 1000;
    }

    nav {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 1.05rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-family: Manrope, sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
      text-decoration: none;
    }

    .nav-logo span { color: var(--muted); font-weight: 500; }
    .nav-links { display: flex; gap: 1.75rem; }

    .nav-links a {
      font-size: 0.9rem;
      color: var(--muted2);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible,
    .nav-logo:focus-visible { color: var(--accent); }

    .nav-links a:focus-visible,
    .nav-logo:focus-visible,
    .back-link:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    main {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 8rem 3rem 5rem;
    }

    .sec-label {
      font-size: 0.68rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.6rem;
    }

    .sec-label::before {
      content: "";
      width: 16px;
      height: 1px;
      background: var(--accent);
    }

    h1 {
      font-family: Manrope, sans-serif;
      font-size: clamp(2rem, 4vw, 2.75rem);
      line-height: 1.2;
      letter-spacing: -0.04em;
      margin-bottom: 0.75rem;
    }

    .intro {
      font-size: 0.95rem;
      line-height: 1.65;
      color: var(--muted2);
      margin-bottom: 1.5rem;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: start;
      gap: 1rem;
    }

    .gallery-item {
      align-self: start;
      overflow: hidden;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: auto;
    }

    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.65rem 1.15rem;
      color: var(--accent);
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .back-link:hover {
      color: var(--accent2);
      border-color: var(--accent);
      background: #eff6ff;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 1.25rem 3rem;
      color: var(--muted);
      font-size: 0.75rem;
      text-align: center;
    }

    @media (max-width: 768px) {
      nav { padding: 0.8rem 1rem; }
      .nav-links { gap: 0.8rem; }
      .nav-links a { font-size: 0.72rem; white-space: nowrap; }
      main { padding: 7rem 1.25rem 3.5rem; }
      .gallery-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      footer { padding: 1rem; }
    }

    @media (max-width: 480px) {
      .gallery-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Main navigation">

      <figure class="gallery-item"><img src="images/circuits02.jpeg" alt="Circuit diagram: circuits02" /></figure>
      <figure class="gallery-item"><img src="images/circuits03.jpeg" alt="Circuit diagram: circuits03" /></figure>

      <figure class="gallery-item"><img src="images/circuits05.jpeg" alt="Circuit diagram: circuits05" /></figure>
      <figure class="gallery-item"><img src="images/clientproject01.jpg" alt="Client project photo: clientproject01" /></figure>
      <figure class="gallery-item"><img src="images/clientproject03.jpg" alt="Client project photo: clientproject03" /></figure>
      <figure class="gallery-item"><img src="images/gamingpcb.png" alt="Gaming PCB project" /></figure>

    </div>
    <a class="back-link" href="index.html">Back to homepage</a>
  </main>

  <footer>Purvesh Mandawkar · Project Gallery</footer>
</body>
</html>
