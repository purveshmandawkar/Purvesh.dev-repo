<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Material | Purvesh Mandawkar</title>
  <meta name="description" content="Browse academic and technical resources, research projects, PCB design materials, and training resources." />
  <link rel="canonical" href="https://purvesh.dev/study-material.html" />
  <meta property="og:title" content="Study Material | Purvesh Mandawkar" />
  <meta property="og:description" content="Browse academic and technical resources, research projects, PCB design materials, and training resources." />
  <meta property="og:url" content="https://purvesh.dev/study-material.html" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg: #ffffff;
      --bg2: #f8fafc;
      --border: #e2e8f0;
      --border2: #cbd5e1;
      --accent: #2563eb;
      --accent2: #1d4ed8;
      --text: #0f172a;
      --muted: #64748b;
      --muted2: #475569;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 400 1rem/1.6 Inter, sans-serif;
    }

    a { color: inherit; }

    .skip-link {
      position: fixed;
      z-index: 2000;
      top: 0.75rem;
      left: 0.75rem;
      padding: 0.55rem 0.8rem;
      transform: translateY(-200%);
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }

    .skip-link:focus { transform: translateY(0); }

    header {
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    nav {
      display: flex;
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 1.05rem 3rem;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .nav-logo {
      flex-shrink: 0;
      color: var(--text);
      font: 700 0.95rem Manrope, sans-serif;
      text-decoration: none;
    }

    .nav-logo span { color: var(--muted); font-weight: 500; }
    .nav-links { display: flex; min-width: 0; gap: 1.4rem; }

    .nav-links a {
      position: relative;
      padding: 0.35rem 0;
      color: var(--muted2);
      font-size: 0.86rem;
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-links a:hover,
    .nav-links a[aria-current="page"] { color: var(--accent); }

    .nav-links a[aria-current="page"]::after {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 2px;
      background: var(--accent);
      content: "";
    }

    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    main {
      width: min(1100px, 100%);
      min-height: calc(100vh - 70px);
      margin: 0 auto;
      padding: 7.5rem 3rem 4rem;
    }

    .eyebrow {
      display: flex;
      margin: 0 0 0.6rem;
      align-items: center;
      gap: 0.7rem;
      color: var(--accent);
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 16px;
      height: 1px;
      background: var(--accent);
      content: "";
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      margin-bottom: 0.65rem;
      font: 800 clamp(2rem, 4vw, 2.75rem)/1.2 Manrope, sans-serif;
      letter-spacing: -0.04em;
    }

    .intro {
      max-width: 660px;
      margin-bottom: 1.25rem;
      color: var(--muted2);
      font-size: 0.95rem;
    }

    .file-explorer {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 0.8rem;
      background: var(--bg);
    }

    .explorer-toolbar {
      display: flex;
      min-height: 3.75rem;
      padding: 0.75rem 1rem;
      align-items: center;
      gap: 0.35rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
    }

    .breadcrumbs {
      display: flex;
      min-width: 0;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.83rem;
    }

    .breadcrumbs a {
      padding: 0.2rem 0.35rem;
      border-radius: 0.3rem;
      color: var(--muted2);
      text-decoration: none;
    }

    .breadcrumbs a:hover {
      background: #eaf1ff;
      color: var(--accent);
    }

    .breadcrumbs [aria-current="page"] {
      padding: 0.2rem 0.35rem;
      color: var(--text);
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .breadcrumb-separator { color: var(--muted); }

    .explorer-heading {
      display: flex;
      padding: 1.15rem 1.25rem 0.5rem;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
    }

    .explorer-heading h2 {
      margin: 0;
      font: 700 1.08rem/1.4 Manrope, sans-serif;
      overflow-wrap: anywhere;
    }

    .item-count {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 0.77rem;
    }

    .entry-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      padding: 0.6rem 1.25rem 1.25rem;
      gap: 0.65rem;
    }

    .entry-card {
      display: flex;
      min-width: 0;
      min-height: 76px;
      padding: 0.8rem 0.9rem;
      align-items: center;
      gap: 0.8rem;
      border: 1px solid var(--border);
      border-radius: 0.6rem;
      background: #fff;
      transition: border-color 0.18s, background 0.18s, transform 0.18s;
    }

    .entry-card--folder {
      color: inherit;
      cursor: pointer;
      text-decoration: none;
    }

    .entry-card--folder:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .entry-card:hover {
      transform: translateY(-1px);
      border-color: #bfdbfe;
      background: #fbfdff;
    }

    .entry-icon {
      display: grid;
      width: 2.35rem;
      height: 2.35rem;
      flex: 0 0 2.35rem;
      border-radius: 0.5rem;
      background: #eff6ff;
      color: var(--accent);
      place-items: center;
    }

    .entry-icon svg { width: 1.35rem; height: 1.35rem; }
    .entry-icon--file { background: #fff1f2; color: #e11d48; }
    .entry-details { min-width: 0; flex: 1; }

    .entry-name {
      display: block;
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.4;
      overflow-wrap: anywhere;
      text-decoration: none;
    }

    .entry-name:hover { color: var(--accent); }

    .entry-meta {
      display: block;
      margin-top: 0.2rem;
      color: var(--muted);
      font-size: 0.74rem;
    }

    .folder-chevron {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 1.2rem;
      line-height: 1;
    }

    .entry-actions {
      display: flex;
      flex: 0 0 auto;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.3rem 0.65rem;
    }

    .entry-action {
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }

    .entry-action:hover { color: var(--accent2); text-decoration: underline; }

    .empty-state {
      margin: 0.5rem 1.25rem 1.25rem;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 0.55rem;
      background: var(--bg2);
      color: var(--muted2);
      font-size: 0.88rem;
    }

    .error-state { border-color: #fecaca; background: #fff7f7; }

    footer {
      border-top: 1px solid var(--border);
      padding: 1.25rem 3rem;
      color: var(--muted);
      font-size: 0.75rem;
      text-align: center;
    }

    @media (max-width: 768px) {
      nav { padding: 0.8rem 1rem; }
      .nav-links { gap: 0.8rem; }
      .nav-links a { font-size: 0.72rem; }
      main { padding: 7rem 1.25rem 3rem; }
      footer { padding: 1rem; }
    }

    @media (max-width: 560px) {
      nav { flex-wrap: wrap; gap: 0.35rem 1rem; }
      .nav-links {
        flex: 1 1 100%;
        justify-content: space-between;
        gap: 0.45rem;
      }
      .nav-links a { font-size: 0.68rem; }
      main { padding-top: 6.5rem; }
      .entry-list { grid-template-columns: minmax(0, 1fr); padding: 0.5rem 0.75rem 0.75rem; }
      .explorer-heading { padding-right: 0.85rem; padding-left: 0.85rem; }
      .explorer-toolbar { padding-right: 0.65rem; padding-left: 0.65rem; }
      .entry-card { padding: 0.7rem; }
      .entry-actions { flex-direction: column; align-items: flex-end; }
      .empty-state { margin-right: 0.75rem; margin-left: 0.75rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header>
    <nav aria-label="Main navigation">
      <a class="nav-logo" href="index.html">Purvesh <span>Mandawkar</span></a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="index.html#projects">Projects</a>
        <a href="index.html#about">About</a>
        <a href="study-material.html" aria-current="page">Study Material</a>
        <a href="index.html#contact">Contact</a>
      </div>
    </nav>
  </header>

  <main id="main-content">
    <p class="eyebrow">Academic resources</p>
    <h1>Study Material</h1>
    <p class="intro">Browse academic and technical resources by collection. Open a folder to explore its contents or download a document.</p>

    <section class="file-explorer" aria-label="Study material file explorer" aria-live="polite">
      <div class="explorer-toolbar">
        <nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb"></nav>
      </div>
      <div class="explorer-heading">
        <h2 id="folder-title">Study Material</h2>
        <span class="item-count" id="item-count"></span>
      </div>
      <div class="entry-list" id="entry-list"></div>
      <p class="empty-state" id="explorer-message" hidden></p>
    </section>
  </main>

  <footer>Purvesh Mandawkar · Study Material</footer>

  <script src="study-material-data.js"></script>
  <script>
    const root = window.studyMaterialTree;
    const entryList = document.getElementById("entry-list");
    const breadcrumbs = document.getElementById("breadcrumbs");
    const folderTitle = document.getElementById("folder-title");
    const itemCount = document.getElementById("item-count");
    const explorerMessage = document.getElementById("explorer-message");
    const folderIcon = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.5 6.75A1.75 1.75 0 0 1 5.25 5h4.1l1.9 2h7.5A1.75 1.75 0 0 1 20.5 8.75v8.5A1.75 1.75 0 0 1 18.75 19h-13A2.25 2.25 0 0 1 3.5 16.75v-10Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M3.75 9h16.5" stroke="currentColor" stroke-width="1.7"/></svg>';
    const fileIcon = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6.5 3.75h7l4 4v12.5H6.5V3.75Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M13.25 4v4h4M8.8 12h6.4m-6.4 3h6.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
    function encodePath(path) {
      return path.split("/").map(encodeURIComponent).join("/");
    }

    function explorerUrl(path) {
      return path ? "study-material.html?path=" + encodeURIComponent(path) : "study-material.html";
    }

    function findFolder(node, path) {
      if (!path) return node;
      if (node.path === path && node.type === "folder") return node;
      for (const child of node.children || []) {
        const found = findFolder(child, path);
        if (found) return found;
      }
      return null;
    }

    function createBreadcrumbs(folder) {
      const ancestors = [];
      let current = folder;
      while (current && current.path) {
        ancestors.unshift(current);
        current = findParent(root, current.path);
      }

      const home = document.createElement("a");
      home.href = explorerUrl("");
      home.textContent = "Study Material";
      breadcrumbs.append(home);

      ancestors.forEach((ancestor, index) => {
        const separator = document.createElement("span");
        separator.className = "breadcrumb-separator";
        separator.setAttribute("aria-hidden", "true");
        separator.textContent = "›";
        breadcrumbs.append(separator);

        if (index === ancestors.length - 1) {
          const currentCrumb = document.createElement("span");
          currentCrumb.textContent = ancestor.name;
          currentCrumb.setAttribute("aria-current", "page");
          breadcrumbs.append(currentCrumb);
        } else {
          const link = document.createElement("a");
          link.href = explorerUrl(ancestor.path);
          link.textContent = ancestor.name;
          breadcrumbs.append(link);
        }
      });
    }

    function findParent(node, childPath) {
      for (const child of node.children || []) {
        if (child.path === childPath) return node;
        const parent = findParent(child, childPath);
        if (parent) return parent;
      }
      return null;
    }

    function displayFolder(folder) {
      folderTitle.textContent = folder.name;
      const entries = folder.children || [];
      const itemLabel = entries.length + (entries.length === 1 ? " item" : " items");
      itemCount.textContent = folder.comingSoon ? itemLabel + " · Coming soon" : itemLabel;
      createBreadcrumbs(folder);
      entryList.replaceChildren();
      explorerMessage.hidden = !folder.comingSoon;
      explorerMessage.classList.remove("error-state");
      explorerMessage.textContent = folder.comingSoon || "";

      for (const entry of entries) {
        const isFolder = entry.type === "folder";
        const card = document.createElement(isFolder ? "a" : "article");
        card.className = isFolder ? "entry-card entry-card--folder" : "entry-card";
        if (isFolder) card.href = explorerUrl(entry.path);

        const icon = document.createElement("span");
        icon.className = isFolder ? "entry-icon" : "entry-icon entry-icon--file";
        icon.innerHTML = isFolder ? folderIcon : fileIcon;

        const details = document.createElement("div");
        details.className = "entry-details";
        const name = document.createElement("span");
        name.className = "entry-name";
        name.textContent = entry.name;

        if (isFolder) {
          const meta = document.createElement("span");
          meta.className = "entry-meta";
          const childCount = (entry.children || []).length;
          const childLabel = childCount + (childCount === 1 ? " item" : " items");
          meta.textContent = entry.comingSoon ? childLabel + " · Coming soon" : childLabel;
          details.append(name, meta);

          const chevron = document.createElement("span");
          chevron.className = "folder-chevron";
          chevron.setAttribute("aria-hidden", "true");
          chevron.textContent = "›";
          card.append(icon, details, chevron);
        } else {
          const extension = entry.name.includes(".") ? entry.name.split(".").pop().toUpperCase() : "FILE";
          const meta = document.createElement("span");
          meta.className = "entry-meta";
          meta.textContent = extension + " file";
          details.append(name, meta);

          const actions = document.createElement("div");
          actions.className = "entry-actions";
          const fileUrl = encodePath(entry.path);
          const isPdf = extension === "PDF";
          const isImage = ["JPG", "JPEG", "PNG", "GIF", "SVG", "WEBP"].includes(extension);

          if (isPdf || isImage) {
            const openLink = document.createElement("a");
            openLink.className = "entry-action";
            openLink.href = fileUrl;
            openLink.target = "_blank";
            openLink.rel = "noopener noreferrer";
            openLink.textContent = isPdf ? "Open PDF" : "View";
            openLink.setAttribute("aria-label", (isPdf ? "Open " : "View ") + entry.name + " in a new tab");
            actions.append(openLink);
          }

          const downloadLink = document.createElement("a");
          downloadLink.className = "entry-action";
          downloadLink.href = fileUrl;
          downloadLink.download = entry.name;
          downloadLink.textContent = "Download";
          downloadLink.setAttribute("aria-label", "Download " + entry.name);
          actions.append(downloadLink);
          card.append(icon, details, actions);
        }

        entryList.append(card);
      }
    }

    if (!root || root.type !== "folder") {
      folderTitle.textContent = "Study Material unavailable";
      itemCount.textContent = "";
      explorerMessage.hidden = false;
      explorerMessage.classList.add("error-state");
      explorerMessage.textContent = "The material listing could not be loaded. Please try again later.";
    } else {
      const requestedPath = new URLSearchParams(window.location.search).get("path") || "";
      const folder = findFolder(root, requestedPath);

      if (folder) {
        displayFolder(folder);
      } else {
        folderTitle.textContent = "Folder not found";
        itemCount.textContent = "";
        explorerMessage.hidden = false;
        explorerMessage.classList.add("error-state");
        explorerMessage.textContent = "This folder is not part of the current Study Material collection.";
        createBreadcrumbs(root);
      }
    }
  </script>
</body>
</html>
